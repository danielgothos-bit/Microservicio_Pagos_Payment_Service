services:
  - type: web
    name: payment-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payment-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: payment-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: RUN_WORKER_IN_WEB
        value: "1"

  - type: keyvalue
    name: payment-redis
    plan: free
    ipAllowList: []

databases:
  - name: payment-db
    databaseName: payment_db
    user: payment_user
    plan: free
